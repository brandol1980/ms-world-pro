<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FABIO-TV FUEGO</title>
<style>
body{margin:0;background:#060a1e;color:#fff;font-family:Arial;display:flex;flex-direction:column;height:100vh}
header{background:#000;border-bottom:3px solid #ff5a00;padding:12px;text-align:center}
h1{margin:0;color:#ff5a00;font-size:22px}
video{width:100%;height:38vh;background:#000}
#search{width:94%;margin:10px 3%;padding:13px;border-radius:25px;border:1px solid #22306a;background:#111c3f;color:#fff;outline:none}
#info{text-align:center;padding:6px;color:#8aa0ff;font-size:12px}
#lista{flex:1;overflow:auto}
.c{padding:14px;border-bottom:1px solid #141f4a;cursor:pointer}
.c:hover{background:#111c3f}
.c b{font-size:14px}
footer{text-align:center;font-size:10px;color:#555;padding:6px}
</style>
</head>
<body>
<header><h1>🔥 FABIO-TV FUEGO v3.0</h1><div style="color:#aaa;font-size:11px">30.195 canales - TODO EN 1</div></header>
<video id="v" controls autoplay playsinline></video>
<input id="search" placeholder="Buscar: COLOMBIA, PERU, MEXICO, DEPORTES...">
<div id="info">Cargando canales...</div>
<div id="lista"></div>
<footer>FABIO-TV FUEGO - Tu app definitiva</footer>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.7/dist/hls.min.js"></script>
<script>
let TODOS=[];
fetch('./index.m3u').then(r=>r.text()).then(t=>{
 let lineas=t.split('\n'), nombre='';
 lineas.forEach(l=>{
  l=l.trim();
  if(l.startsWith('#EXTINF')){nombre=l.split(',').pop()}
  else if(l.startsWith('http')){if(nombre){TODOS.push({n:nombre,u:l});nombre=''}}});
 document.getElementById('info').textContent=TODOS.length+' canales cargados';
 mostrar(TODOS.slice(0,800));
});
function mostrar(arr){
 document.getElementById('lista').innerHTML=arr.map(x=>`<div class=c onclick="repro('${x.u.replace(/'/g,"")}')"><b>${x.n}</b> ▶</div>`).join('');
}
function repro(url){
 let v=document.getElementById('v');
 if(Hls.isSupported()){let h=new Hls();h.loadSource(url);h.attachMedia(v);h.on(Hls.Events.MANIFEST_PARSED,()=>v.play());}
 else{v.src=url;v.play();}
 window.scrollTo(0,0);
}
document.getElementById('search').oninput=e=>{
 let q=e.target.value.toLowerCase();
 let f=TODOS.filter(c=>c.n.toLowerCase().includes(q));
 document.getElementById('info').textContent=f.length+' resultados';
 mostrar(f.slice(0,800));
}
</script>
</body>
</html>
